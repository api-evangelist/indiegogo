aid: indiegogo
name: Indiegogo
description: >-
  Indiegogo is a global crowdfunding platform where entrepreneurs, inventors, and
  creators raise money for products, creative works, and community projects
  through campaigns backed by individual contributors. Founded in 2008, it is one
  of the largest reward-based crowdfunding sites alongside Kickstarter, and it
  also runs InDemand for ongoing post-campaign fundraising. For developers,
  Indiegogo publishes a read-only Public API (https://www.indiegogo.com/api/public)
  that returns creators and active crowdfunding projects without authentication,
  with responses cached for a short duration. A separate, now-deprecated Partner
  API (api.indiegogo.com) previously offered token-authenticated access to
  campaign, perk, contribution, and comment data. This profile was seeded from
  VC-portfolio sourcing and enriched by the API Evangelist pipeline against the
  live public endpoints.
